#
#                                   . d o t s
#                           Module claude
#
# Claude Code, nono sandbox and AI tooling.
# Always loaded, every OS. Sources are relative to this folder (home/ tree).
# Global tools/env go to ~/.config/mise/conf.d/claude/mise.toml (a dotfile of this module).
#
# Sections used here:
#   [bootstrap.packages]: Homebrew formulas/casks to install; anything not declared by a loaded file is pruned after install.
#   [dotfiles]: files to deploy into $HOME. `symlink` points back into this repo (edit here, no re-apply),
#   `template` renders a *.tera file (Tera), `absent` removes a retired file.
# -----------------------------------------------------------------------------

[bootstrap.packages]
"brew:llmfit" = "latest"  # check what LLMs fit your hardware
"brew:nono" = "latest"  # sandboxes `claude` (see 50-aliases.fish) — kernel-level tool isolation
"brew:rtk" = "latest"  # CLI proxy, trims noisy command output before it hits context
"brew:gitleaks" = "latest"  # secret scanner, used by Claude Code's secret-redactor hook

[dotfiles]
"~/.config/nono/profiles" = { source = "home/.config/nono/profiles", mode = "symlink-each" }
"~/.config/ccstatusline/settings.json" = { source = "home/.config/ccstatusline/settings.json", mode = "symlink" }
"~/.ssh/config.d/nono" = { source = "home/.ssh/config.d/nono", mode = "symlink" }
"~/.claude/settings.json" = { source = "home/.claude/settings.json.tera", mode = "template", permissions = "0600" }
"~/.claude/CLAUDE.md" = { source = "home/.claude/CLAUDE.md", mode = "symlink" }
"~/.claude/SOUL.md" = { source = "home/.claude/SOUL.md", mode = "symlink" }
"~/.claude/RTK.md" = { source = "home/.claude/RTK.md", mode = "symlink" }
"~/.claude/NONO.md" = { source = "home/.claude/NONO.md", mode = "symlink" }
"~/.claude/agents/git-commit-assistant.md" = { source = "home/.claude/agents/git-commit-assistant.md", mode = "symlink" }
"~/.claude/agents/tech-doc-writer.md" = { source = "home/.claude/agents/tech-doc-writer.md", mode = "symlink" }
"~/.claude/agents/workflow-documentation-assistant.md" = { source = "home/.claude/agents/workflow-documentation-assistant.md", mode = "symlink" }
"~/.claude/hooks/per-command/gitleaks-redact.sh" = { source = "home/.claude/hooks/per-command/gitleaks-redact.sh", mode = "symlink" }
"~/.claude/skills/plannotator" = { source = "home/.claude/skills/plannotator", mode = "symlink" }
"~/.claude/skills/plannotator-annotate" = { source = "home/.claude/skills/plannotator-annotate", mode = "symlink" }
"~/.claude/skills/plannotator-last" = { source = "home/.claude/skills/plannotator-last", mode = "symlink" }
"~/.claude/skills/plannotator-review" = { source = "home/.claude/skills/plannotator-review", mode = "symlink" }
"~/.config/fish/functions/clawd.fish" = { source = "home/.config/fish/functions/clawd.fish", mode = "symlink" }
"~/.config/fish/functions/__clawd_run.fish" = { source = "home/.config/fish/functions/__clawd_run.fish", mode = "symlink" }
"~/.config/fish/functions/nono-profile.fish" = { source = "home/.config/fish/functions/nono-profile.fish", mode = "symlink" }
"~/.config/fish/completions/nono-profile.fish" = { source = "home/.config/fish/completions/nono-profile.fish", mode = "symlink" }
"~/.config/fish/functions/__claude_default_profile.fish" = { source = "home/.config/fish/functions/__claude_default_profile.fish", mode = "symlink" }
"~/.config/fish/functions/__claude_pin.fish" = { source = "home/.config/fish/functions/__claude_pin.fish", mode = "symlink" }
"~/.config/fish/functions/__claude_profile_for.fish" = { source = "home/.config/fish/functions/__claude_profile_for.fish", mode = "symlink" }
"~/.config/fish/functions/__claude_profile_list.fish" = { source = "home/.config/fish/functions/__claude_profile_list.fish", mode = "symlink" }
"~/.config/fish/functions/__claude_repo_slug.fish" = { source = "home/.config/fish/functions/__claude_repo_slug.fish", mode = "symlink" }
"~/.config/fish/functions/__claude_unpin.fish" = { source = "home/.config/fish/functions/__claude_unpin.fish", mode = "symlink" }
"~/.config/fish/functions/__claude_user_profile_list.fish" = { source = "home/.config/fish/functions/__claude_user_profile_list.fish", mode = "symlink" }
"~/.config/mise/conf.d/claude/mise.toml" = { source = "home/.config/mise/conf.d/claude/mise.toml", mode = "symlink" }
