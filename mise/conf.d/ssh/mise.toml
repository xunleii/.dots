#
#                                   . d o t s
#                           Module ssh
#
# ssh files, Secretive (Secure Enclave agent) and the Bitwarden SSH agent.
# Always loaded, every OS. Sources are relative to this folder (home/ tree).
# Global tools/env go to ~/.config/mise/conf.d/ssh/mise.toml (a dotfile of this module).
#
# Sections used here:
#   [dotfiles]: files to deploy into $HOME. `symlink` points back into this repo (edit here, no re-apply),
#   `template` renders a *.tera file (Tera), `absent` removes a retired file.
# -----------------------------------------------------------------------------

[dotfiles]
"~/.ssh/allowed_signers" = { source = "home/.ssh/allowed_signers.tera", mode = "template" }
"~/.config/fish/functions/__bw_exec.fish" = { source = "home/.config/fish/functions/__bw_exec.fish", mode = "symlink" }
"~/.config/fish/functions/__bw_ssh_sock.fish" = { source = "home/.config/fish/functions/__bw_ssh_sock.fish", mode = "symlink" }
"~/.config/fish/functions/bwssh.fish" = { source = "home/.config/fish/functions/bwssh.fish", mode = "symlink" }
"~/.config/fish/functions/bwansible.fish" = { source = "home/.config/fish/functions/bwansible.fish", mode = "symlink" }
"~/.config/fish/functions/bwansible-playbook.fish" = { source = "home/.config/fish/functions/bwansible-playbook.fish", mode = "symlink" }
"~/.config/fish/functions/ssh-import-key.fish" = { source = "home/.config/fish/functions/ssh-import-key.fish", mode = "symlink" }
