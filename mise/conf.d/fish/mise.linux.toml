#
#                                   . d o t s
#                           Module fish (Linux only)
#
# Loaded automatically on Linux (platform environment). No Homebrew cask/formula route there,
# so fish itself comes from mise: a static build, installed by the `tools` phase.
#
# Sections used here:
#   [dotfiles]: files to deploy into $HOME (`symlink` points back into this repo).
# -----------------------------------------------------------------------------

[dotfiles]
"~/.config/mise/conf.d/fish/mise.toml" = { source = "home/.config/mise/conf.d/fish/mise.toml", mode = "symlink" }
