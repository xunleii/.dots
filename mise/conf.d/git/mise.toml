#
#                                   . d o t s
#                           Module git
#
# gitconfig, signing identity and git tooling.
# Always loaded, every OS. Sources are relative to this folder (home/ tree).
# Global tools/env go to ~/.config/mise/conf.d/git/mise.toml (a dotfile of this module).
#
# Sections used here:
#   [bootstrap.packages]: Homebrew formulas/casks to install; anything not declared by a loaded file is pruned after install.
#   [dotfiles]: files to deploy into $HOME. `symlink` points back into this repo (edit here, no re-apply),
#   `template` renders a *.tera file (Tera), `absent` removes a retired file.
# -----------------------------------------------------------------------------

[bootstrap.packages]
"brew:gnupg" = "latest"  # OpenPGP implementation
"brew:colordiff" = "latest"  # colorized diff output
"brew:difftastic" = "latest"  # syntax-aware structural diff
"brew:gh" = "latest"  # GitHub CLI
"brew:git-absorb" = "latest"  # auto-fixup commits into git history
"brew:git-lfs" = "latest"  # git large file storage
"brew:lazygit" = "latest"  # terminal UI for git
"brew:worktrunk" = "latest"  # Git worktree management

[dotfiles]
"~/.config/lazygit" = { source = "home/.config/lazygit", mode = "symlink-each" }
"~/.gitconfig" = { source = "home/.gitconfig.tera", mode = "template" }
"~/.gitignore" = { source = "home/.gitignore", mode = "symlink" }
"~/.config/fish/functions/__git_remote_slug.fish" = { source = "home/.config/fish/functions/__git_remote_slug.fish", mode = "symlink" }
"~/.config/mise/conf.d/git/mise.toml" = { source = "home/.config/mise/conf.d/git/mise.toml", mode = "symlink" }
"~/.config/fish/functions/clone.fish" = { source = "home/.config/fish/functions/clone.fish", mode = "symlink" }
