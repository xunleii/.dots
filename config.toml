#                                       __
#                                     /\\ \
#                                   /\\ \\ \\
#                                   \// // //
#                                     \//_/
#
#                                   . d o t s
#                           Mise - Base (global config)
#
# This repo IS ~/.config/mise (installed with `mise bootstrap --adopt`): this file is the global
# config, conf.d/<module>/ are global fragments, so every mise command works from anywhere.
# Always loaded, on every OS. Loaded AFTER conf.d, so it overrides it: never give per-machine
# vars (git_email, git_signingkey) a default here (git_email's default lives in conf.d/git).
# Modules: conf.d/<name>/mise.toml (always), mise.macos.toml / mise.linux.toml (per OS), and
# conf.d/machines/mise.<profile>.toml (selected with -E or miserc.local.toml).
# Sources of [dotfiles] are relative to the file that declares them; *.tera files are rendered.
# =============================================================================

# =============================================================================
# Settings
# =============================================================================
# mise behaviour switches (experimental features, idiomatic version files).

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["terraform"]

# =============================================================================
# Variables
# =============================================================================
# Values shared by templates and tasks; read them as {{ vars.<name> }}.

[vars]
# Volume holding every toolchain, cache and package dir: mise data (MISE_DATA_DIR below) and the
# node/go/rust/python/uv caches (see [env]). Declared once here: never hardcode the path elsewhere.
runtimes_root = "/Volumes/Runtimes"

# Volume holding every working copy, laid out as <spaces_root>/<Space>/<host>/<user>/<repo>.
# Exported to fish by conf.d/fish (40-environment.fish.tera) and used by the `clone` function.
spaces_root = "/Volumes/Spaces"

# The Spaces (top-level folders of spaces_root), exported to fish as $SPACES and used by `clone`.
# Space-separated: [vars] only takes scalars. Adding a Space = one edit here.
spaces = "Lab Work OSS Personal"

# Git identity, rendered into ~/.gitconfig and ~/.ssh/allowed_signers (conf.d/git, conf.d/ssh).
# It is public on purpose (it ends up in every commit). The name is shared; git_email (default in
# conf.d/git, overridden per profile) and git_signingkey (per machine) must NOT be set here: this
# file loads AFTER conf.d, so a value here would override the machine files.
git_name = "Alexandre NICOLAIE"

# =============================================================================
# Environment
# =============================================================================
# Environment variables mise exports in every shell.

[env]
# Where mise keeps its installs, shims and downloads: on the runtimes volume, not the system disk.
MISE_DATA_DIR = "{{ vars.runtimes_root }}/mise"
# PATH additions (mise env._.path prepends them): ~/.local/bin, then the runtimes' bin dirs.
_.path = [
    "{{ env.HOME }}/.local/bin",
    "{{ vars.runtimes_root }}/node/npm/bin",
    "{{ vars.runtimes_root }}/go/bin",
    "{{ vars.runtimes_root }}/rust/cargo/bin",
]

# [vars] exported as environment variables, for scripts and tasks that cannot read Tera
# (the dots:check:volumes and dots:check:nix tasks).
# Each toolchain's cache/install dir, redirected onto the runtimes volume (one block per runtime
# declared in [tools] below).
npm_config_cache = "{{ vars.runtimes_root }}/node/npm/cache"
npm_config_prefix = "{{ vars.runtimes_root }}/node/npm"

GOPATH = "{{ vars.runtimes_root }}/go"
GOCACHE = "{{ vars.runtimes_root }}/go/cache"
GOMODCACHE = "{{ vars.runtimes_root }}/go/mod"

CARGO_HOME = "{{ vars.runtimes_root }}/rust/cargo"
CARGO_TARGET_DIR = "{{ vars.runtimes_root }}/rust/cargo/target"

PIP_CACHE_DIR = "{{ vars.runtimes_root }}/python/pip"
UV_CACHE_DIR = "{{ vars.runtimes_root }}/python/uv"

MISE_VAR_RUNTIMES_ROOT = "{{ vars.runtimes_root }}"
MISE_VAR_SPACES_ROOT = "{{ vars.spaces_root }}"
MISE_VAR_NIX = "{{ vars.nix | default(value=\"\") }}"

# =============================================================================
# Bootstrap
# =============================================================================
# What `mise bootstrap` does around its phases: shell activation and hooks.
# Hooks run EVERY time, so keep them safe to repeat.

# Bootstrap: packages -> dotfiles -> tools (see `mise bootstrap --help`). The macOS-only volume
# check (pre-packages hook) lives in config.macos.toml. The tasks the hooks run are file tasks in
# tasks/ (tasks/dots/persist/profile -> dots:persist:profile), documented in their own header.
# mise activation in fish (prompt hook; shims in scripts). Replaces `mise activate fish | source`.
[bootstrap.mise_shell_activate]
fish = "auto"

# Homebrew behaviour. adopt: a cask already installed by Homebrew is taken over by mise when its
# content is identical to the cask's download, so `mise bootstrap packages upgrade` can upgrade it
# (it skips Homebrew-managed casks otherwise). Run `brew upgrade --cask` once first so the installed
# app matches the current download. A single entry can opt out with `{ adopt = false }`.
[bootstrap.brew]
adopt = true

[bootstrap.hooks.post-packages]
# dots:persist:profile first: later runs without -E must keep the same profile (and keep its packages).
# --skip-tools: `mise run` would otherwise install every global tool before the `tools` phase.
run = ["mise run --skip-tools dots:persist:profile"]

# =============================================================================
# Tools
# =============================================================================
# Global mise tools, on PATH everywhere (not only inside this repo).

[tools]
# -----------------------------------------------------------------------------
# Language runtimes and package managers
# -----------------------------------------------------------------------------
# Always installed, by the base config: the npm:, pipx:, cargo: and go: tools of every module
# depend on them, and `uv` is what mise needs to install the pipx: ones.
go = "1.27"
node = "26"
rust = "1.99"
python = "3.15"
uv = "latest"

# -----------------------------------------------------------------------------
# Mise's own helpers
# -----------------------------------------------------------------------------
# Fetched by mise itself (completions, task usage specs).
usage = "latest"

# =============================================================================
# Packages
# =============================================================================
# Homebrew formulas and casks to install.
# Not pruned automatically: `mise bootstrap packages prune` removes what no loaded file declares.
[bootstrap.packages]
# -----------------------------------------------------------------------------
# Downloads
# -----------------------------------------------------------------------------
"brew:curl" = "latest"  # HTTP client, newer than the system one
"brew:wget" = "latest"  # HTTP(S)/FTP file retriever

# -----------------------------------------------------------------------------
# System
# -----------------------------------------------------------------------------
"brew:btop" = "latest"  # resource monitor (TUI)
"brew:procs" = "latest"  # modern `ps` replacement
"brew:tree" = "latest"  # directory tree listing
"brew:gum" = "latest"  # styled output for the task scripts (scripts/ui.sh)

# -----------------------------------------------------------------------------
# Files and search
# -----------------------------------------------------------------------------
"brew:bat" = "latest"  # `cat` with syntax highlighting
"brew:eza" = "latest"  # modern `ls` replacement
"brew:fd" = "latest"  # fast `find` alternative
"brew:ripgrep" = "latest"  # fast recursive grep

# -----------------------------------------------------------------------------
# Text and binary utilities
# -----------------------------------------------------------------------------
"brew:hexyl" = "latest"  # hex viewer
"brew:flock" = "latest"  # lock a file for the duration of a command
"brew:sponge" = "latest"  # soak up stdin, write to a file (moreutils)

# -----------------------------------------------------------------------------
# Graphics and network
# -----------------------------------------------------------------------------
"brew:graphviz" = "latest"  # graph/diagram rendering (`dot`)
"brew:ipcalc" = "latest"  # IP subnet calculator

# =============================================================================
# Dotfiles
# =============================================================================
# Files deployed into $HOME. `symlink` points back into this repo (edit here, nothing to
# re-apply), `template` renders a *.tera file, `absent` removes a retired file.

[dotfiles]
# -----------------------------------------------------------------------------
# Shared files
# -----------------------------------------------------------------------------
"~/.local/bin/dots-banner" = { source = "scripts/banner.sh", mode = "symlink" }

# Retired targets: files and dirs an earlier setup deployed and that must not stay. `absent`
# removes them on the next apply (a no-op once gone), so old machines converge without manual cleanup.
# Files and symlinks only: `absent` errors on a directory (and blocks every diff/apply). Retired
# directories to delete by hand: ~/.config/opencode, ~/.config/ghostty/shaders, ~/.config/herdr,
# ~/.claude/hooks/session, ~/.claude/commands, ~/.local/share/clawd-buddy, ~/Applications/Clawd Buddy.app.
# Retired: Claude Code hooks
"~/.claude/hooks/herdr-agent-state.sh" = { mode = "absent" }

# Retired: fish conf.d files
"~/.config/fish/conf.d/30-utilities.fish" = { mode = "absent" }
"~/.config/fish/conf.d/45-brew.fish" = { mode = "absent" }
"~/.config/fish/conf.d/46-graft.fish" = { mode = "absent" }
"~/.config/fish/conf.d/70-lazy-load.fish" = { mode = "absent" }
"~/.config/fish/conf.d/80-bitwarden-ssh.fish" = { mode = "absent" }
"~/.config/fish/conf.d/80-fzf-tab-config.fish" = { mode = "absent" }
"~/.config/fish/conf.d/keychain.fish" = { mode = "absent" }
"~/.config/fish/conf.d/wsl.fish" = { mode = "absent" }

# Retired: fish functions
"~/.config/fish/functions/__clawd_onboard.fish" = { mode = "absent" }
"~/.config/fish/functions/gotmp.fish" = { mode = "absent" }

# Retired: other config
"~/.config/kitty/kitty.conf" = { mode = "absent" }

# Retired: ~/.local/bin tools
"~/.local/bin/bws" = { mode = "absent" }
"~/.local/bin/clawd-browser" = { mode = "absent" }
"~/.local/bin/clawd-browser-listener" = { mode = "absent" }
"~/.local/bin/clawd-buddy" = { mode = "absent" }
"~/.local/bin/fasd" = { mode = "absent" }
"~/.local/bin/git-wktree" = { mode = "absent" }
"~/.local/bin/lazygit" = { mode = "absent" }
"~/.local/bin/ocx" = { mode = "absent" }
"~/.local/bin/plannotator" = { mode = "absent" }
"~/.local/bin/plannotator-browser" = { mode = "absent" }
"~/.local/bin/zai" = { mode = "absent" }
"~/.local/bin/zoxide" = { mode = "absent" }

# Retired: LaunchAgents
"~/Library/LaunchAgents/com.headroom.proxy.plist" = { mode = "absent" }
"~/Library/LaunchAgents/com.mnemosyne.mcp.plist" = { mode = "absent" }
"~/Library/LaunchAgents/dev.axnic.clawd-browser.plist" = { mode = "absent" }
"~/Library/LaunchAgents/dev.axnic.clawd-buddy.plist" = { mode = "absent" }
