#                           Mise - Base (macOS only)
#
# Loaded automatically on macOS (platform environment): general casks and GNU userland formulas.
# =============================================================================

# =============================================================================
# Tasks
# =============================================================================
# Small idempotent scripts, run by the bootstrap hooks or with `mise run <name>`.

[tasks.check-volumes]
description = "Abort early unless Runtimes and Spaces (and /nix with the nix profile) are mounted, dedicated APFS volumes"
# Absolute path, so the task does not depend on the working directory.
run = "sh ${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/check-volumes.sh"

# =============================================================================
# Bootstrap
# =============================================================================
# What `mise bootstrap` does around its phases: shell activation and hooks.
# Hooks run EVERY time, so keep them safe to repeat.

[bootstrap.hooks.pre-packages]
# --skip-tools: `mise run` would otherwise install every global tool before the packages phase.
run = ["mise run --skip-tools check-volumes"]

# =============================================================================
# Packages
# =============================================================================
# Homebrew formulas and casks to install.
# Not pruned automatically: `mise bootstrap packages prune` removes what no loaded file declares.

[bootstrap.packages]
# GNU userland (preferred over BSD, see conf.d/fish 05-gnu-userland)
"brew:bash" = "latest"  # system bash is 3.2, unusable
"brew:coreutils" = "latest"  # GNU file/shell/text utils
"brew:findutils" = "latest"  # GNU find, xargs, locate
"brew:gawk" = "latest"  # GNU awk
"brew:gnu-sed" = "latest"  # GNU sed
"brew:grep" = "latest"  # GNU grep/egrep/fgrep

# -----------------------------------------------------------------------------
# Desktop utilities
# -----------------------------------------------------------------------------
"brew-cask:betterdisplay" = "latest"  # external display management
"brew-cask:raycast" = "latest"  # launcher / productivity toolbox
"brew-cask:appcleaner" = "latest"  # thorough application uninstaller
"brew-cask:rar" = "latest"  # RAR archive tool
"brew-cask:rsyncui" = "latest"  # GUI for rsync

# -----------------------------------------------------------------------------
# Security and network
# -----------------------------------------------------------------------------
"brew-cask:little-snitch" = "latest"  # outbound application firewall

# -----------------------------------------------------------------------------
# Communication and browsers
# -----------------------------------------------------------------------------
"brew-cask:slack" = "latest"  # team chat
"brew-cask:tailscale-app" = "latest"  # WireGuard-based mesh VPN
"brew-cask:zen" = "latest"  # Gecko-based browser

# -----------------------------------------------------------------------------
# Notes and media
# -----------------------------------------------------------------------------
"brew-cask:octarine" = "latest"  # markdown note-taking app
"brew-cask:deezer" = "latest"  # music streaming
"brew-cask:vlc" = "latest"  # media player
