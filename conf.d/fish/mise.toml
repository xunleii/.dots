#                                       __
#                                     /\\ \
#                                   /\\ \\ \\
#                                   \// // //
#                                     \//_/
#
#                                   . d o t s
#                                  Module fish
#
# Shell, prompt, history, fisher and completions.
# Always loaded, every OS. Dotfile sources are relative to this folder (home/ tree).
# Loaded as a global fragment: [tools] and [env] below are active everywhere, not only in this repo.
# =============================================================================

# =============================================================================
# Bootstrap
# =============================================================================
# What `mise bootstrap` does around its phases: shell activation and hooks.
# Hooks run EVERY time, so keep them safe to repeat.

# Task: conf.d/fish/mise-tasks/dots/fish/plugins (file task, documented in its header).
[bootstrap.hooks.post-dotfiles]
# --skip-tools: `mise run` would otherwise install every global tool first, before the `tools`
# phase (and before uv/pipx exist for the pipx: tools).
run = ["mise run --skip-tools dots:fish:plugins"]

# =============================================================================
# Tools
# =============================================================================
# Global mise tools, on PATH everywhere (not only inside this repo).

[tools]
# -----------------------------------------------------------------------------
# Fuzzy finding
# -----------------------------------------------------------------------------
# Used at call time (fifc Tab completion, fzf.fish keybindings), once mise is activated. starship,
# atuin and zoxide stay Homebrew packages: conf.d runs their `init` at shell startup, BEFORE the
# mise activation block that `mise bootstrap` writes into config.fish.
fzf = "latest"

# =============================================================================
# Packages
# =============================================================================
# Homebrew formulas and casks to install.
# Not pruned automatically: `mise bootstrap packages prune` removes what no loaded file declares.

[bootstrap.packages]
# -----------------------------------------------------------------------------
# Shell and prompt
# -----------------------------------------------------------------------------
"brew:fish" = "latest"  # interactive shell
"brew:starship" = "latest"  # cross-shell prompt

# -----------------------------------------------------------------------------
# History and navigation
# -----------------------------------------------------------------------------
"brew:atuin" = "latest"  # shell history sync/search
"brew:zoxide" = "latest"  # frecency-based `cd` replacement

# =============================================================================
# Dotfiles
# =============================================================================
# Files deployed into $HOME. `symlink` points back into this repo (edit here, nothing to
# re-apply), `template` renders a *.tera file, `absent` removes a retired file.

[dotfiles]
# -----------------------------------------------------------------------------
# Fish config: conf.d files (loaded in numeric order)
# -----------------------------------------------------------------------------
"~/.config/fish/conf.d/00-base.fish" = { source = "home/.config/fish/conf.d/00-base.fish", mode = "symlink" }
"~/.config/fish/conf.d/10-keybindings.fish" = { source = "home/.config/fish/conf.d/10-keybindings.fish", mode = "symlink" }
"~/.config/fish/conf.d/20-prompt.fish" = { source = "home/.config/fish/conf.d/20-prompt.fish", mode = "symlink" }
"~/.config/fish/conf.d/25-tools.fish" = { source = "home/.config/fish/conf.d/25-tools.fish", mode = "symlink" }
"~/.config/fish/conf.d/40-environment.fish" = { source = "home/.config/fish/conf.d/40-environment.fish.tera", mode = "template" }
"~/.config/fish/conf.d/50-aliases.fish" = { source = "home/.config/fish/conf.d/50-aliases.fish", mode = "symlink" }
"~/.config/fish/conf.d/60-functions.fish" = { source = "home/.config/fish/conf.d/60-functions.fish", mode = "symlink" }

# -----------------------------------------------------------------------------
# Fish: functions, completions and plugins
# -----------------------------------------------------------------------------
"~/.config/fish/functions/fish_greeting.fish" = { source = "home/.config/fish/functions/fish_greeting.fish", mode = "symlink" }
"~/.config/fish/completions/fd.fish" = { source = "home/.config/fish/completions/fd.fish", mode = "symlink" }
"~/.config/fish/fish_plugins" = { source = "home/.config/fish/fish_plugins", mode = "symlink" }
"~/.config/fish/.gitignore" = { source = "home/.config/fish/.gitignore", mode = "symlink" }

# -----------------------------------------------------------------------------
# Prompt and history
# -----------------------------------------------------------------------------
"~/.config/starship.toml" = { source = "home/.config/starship.toml", mode = "symlink" }
"~/.config/atuin" = { source = "home/.config/atuin", mode = "symlink-each" }
