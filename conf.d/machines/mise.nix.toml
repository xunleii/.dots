#                           Machine - nix
#
# Not a machine: a feature flag for devices with a dedicated /nix APFS volume.
# Combine it with a profile, since -E replaces the default: mise -E personal,nix bootstrap
# (or radiofrance,nix). Loaded last, wins on conflicts.
# =============================================================================

[vars]
# Makes check-volumes require /nix to be a dedicated APFS volume (see conf.d/nix). Without this
# profile the var is unset and /nix is not checked.
nix = "true"
