# =============================================================================
# Variables
# =============================================================================
# Values shared by templates and tasks; read them as {{ vars.<name> }}.

[vars]
# Personal commit address (~/.gitconfig, ~/.ssh/allowed_signers).
git_email = "xunleii@users.noreply.github.com"
# Public key of this Mac's Secretive (Secure Enclave) key: signs commits (gitconfig) and is trusted
# by allowed_signers. One key per machine; empty means commits are not signed.
git_signingkey = "ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBIU3To0OeQv9jeA0TlLznXgNvV/h3iWqQ9FqG7YKjOOcZwRK4URn9KZwbd6AAxH6eVuEBBzP3QIFFDIcrLFGqJY= git-signing@secretive.Mac-Mini-M4.local"

# =============================================================================
# Packages
# =============================================================================
# Homebrew formulas and casks to install.
# Anything not declared by a loaded file is pruned after install.

[bootstrap.packages]
# Making: CAD and 3D printing
"brew-cask:autodesk-fusion" = "latest"  # CAD/CAM/CAE + PCB software
"brew-cask:bambu-studio" = "latest"  # 3D-printer slicer

# -----------------------------------------------------------------------------
# Media
# -----------------------------------------------------------------------------
"brew-cask:tinymediamanager" = "latest"  # media library organizer
