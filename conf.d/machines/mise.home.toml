# Home machines (personal use): Mac Mini M4 today (holds its own Secretive signing key).
# Selected explicitly: mise -E home bootstrap (loaded last, wins on conflicts).
# =============================================================================

# =============================================================================
# Variables
# =============================================================================
# Values shared by templates and tasks; read them as {{ vars.<name> }}.

[vars]
# Commit address: the default from conf.d/git (GitHub noreply) applies, nothing to set here.
# git_signingkey is machine-local, not here: `mise run --skip-tools setup-signing-key` (conf.d/git).

# =============================================================================
# Packages
# =============================================================================
# Homebrew formulas and casks to install.
# Not pruned automatically: `mise bootstrap packages prune` removes what no loaded file declares.

[bootstrap.packages]
# Making: CAD and 3D printing
"brew-cask:autodesk-fusion" = "latest"  # CAD/CAM/CAE + PCB software
"brew-cask:bambu-studio" = "latest"  # 3D-printer slicer

# -----------------------------------------------------------------------------
# Media
# -----------------------------------------------------------------------------
"brew-cask:tinymediamanager" = "latest"  # media library organizer
