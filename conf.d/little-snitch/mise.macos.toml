#
#                                   . d o t s
#                       Module little-snitch (macOS only)
#
# Little Snitch, the outbound application firewall: the cask, and the subscription to the rule lists that
# the other modules ship: every conf.d/<module>/little-snitch/<name>.lsrules. A module that needs rules just drops
# its file there; the post-dotfiles hook below offers the ones not yet subscribed, one after the other:
# see conf.d/little-snitch/mise-tasks/dots/snitch/subscribe.
# =============================================================================

# =============================================================================
# Packages
# =============================================================================
# Not pruned automatically: `mise bootstrap packages prune` removes what no loaded file declares.

[bootstrap.packages]
"brew-cask:little-snitch" = "latest"  # outbound application firewall (approve its system extension once, see docs/APPLICATIONS.md)

# =============================================================================
# Bootstrap
# =============================================================================
# Hooks run EVERY time, so keep them safe to repeat (the task remembers what is already subscribed).

[bootstrap.hooks.post-dotfiles]
# --skip-tools: `mise run` would otherwise install every global tool first.
run = ["mise run --skip-tools dots:snitch:subscribe"]
