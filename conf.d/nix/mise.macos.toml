#
#                                   . d o t s
#                           Module nix (macOS only)
#
# Nix package manager. Always loaded, but only relevant when the `nix` profile is active
# (`mise -E home,nix bootstrap`, see conf.d/machines/mise.nix.toml): dots:setup:nix installs Nix once with
# the Determinate installer, which creates the /nix APFS volume on the disk you pick (docs/NIX.md), then
# dots:check:nix requires /nix to be a dedicated APFS volume.
# =============================================================================

# =============================================================================
# Bootstrap
# =============================================================================
# What `mise bootstrap` does around its phases: hooks. Hooks of every loaded file run (this one first,
# then the base volumes check in config.macos.toml), and run EVERY time, so keep them safe to repeat.

# Tasks: dots:setup:nix (installs Nix once, creating the /nix volume), then dots:check:nix (/nix must be a
# dedicated volume). File tasks, documented in their header. Both do nothing unless the nix profile is on.
[bootstrap.hooks.pre-packages]
# --skip-tools: `mise run` would otherwise install every global tool before the packages phase.
run = ["mise run --skip-tools dots:setup:nix", "mise run --skip-tools dots:check:nix"]

# =============================================================================
# Dotfiles
# =============================================================================
# Files deployed into $HOME. `symlink` points back into this repo (edit here, nothing to
# re-apply), `template` renders a *.tera file, `absent` removes a retired file.

[dotfiles]
# -----------------------------------------------------------------------------
# Fish: load Nix into the session (a no-op until Nix is installed)
# -----------------------------------------------------------------------------
"~/.config/fish/conf.d/30-nix.fish" = { source = "home/.config/fish/conf.d/30-nix.fish", mode = "symlink" }
