#
#                                   . d o t s
#                           Module ssh (macOS only)
#
# Loaded automatically on macOS: casks and macOS-specific files of this module.
# =============================================================================

# =============================================================================
# Packages
# =============================================================================
# Homebrew formulas and casks to install.
# Not pruned automatically: `mise bootstrap packages prune` removes what no loaded file declares.

[bootstrap.packages]
# -----------------------------------------------------------------------------
# SSH agents
# -----------------------------------------------------------------------------
"brew-cask:bitwarden" = "latest"  # password/login vault (fleet/"machines" SSH access, see bwssh)
"brew-cask:secretive" = "latest"  # Secure Enclave-backed SSH agent (default: commit signing + direct SSH)

# =============================================================================
# Dotfiles
# =============================================================================
# Files deployed into $HOME. `symlink` points back into this repo (edit here, nothing to
# re-apply), `template` renders a *.tera file, `absent` removes a retired file.

[dotfiles]
"~/.config/fish/conf.d/80-secretive-ssh.fish" = { source = "home/.config/fish/conf.d/80-secretive-ssh.fish.tera", mode = "template" }

# =============================================================================
# LaunchAgents
# =============================================================================
# Written to ~/Library/LaunchAgents/dev.mise.<name>.plist and loaded by `mise bootstrap`.

[bootstrap.macos.launchd.agents.secretive-ssh-auth-sock]
# Same socket for the whole login session (not only fish): GUI apps, zsh, agents launched by Orca.
# A running process keeps the env it started with: restart the apps after the first load.
program = "/bin/launchctl"
args = ["setenv", "SSH_AUTH_SOCK", "{{ env.HOME }}/Library/Containers/com.maxgoedjen.Secretive.SecretAgent/Data/socket.ssh"]
run_at_load = true
