# Signing
# -----------------------------------------------------------------------------
"brew:pinentry-mac" = "latest"  # macOS-native GPG passphrase prompt

# -----------------------------------------------------------------------------
# Git client
# -----------------------------------------------------------------------------
"brew-cask:gitbutler" = "latest"  # git client with parallel branches, ships the `but` CLI
