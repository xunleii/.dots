#
#                                   . d o t s
#                                   Module git
#
# gitconfig, signing identity and git tooling.
# Always loaded, every OS. Dotfile sources are relative to this folder (home/ tree).
# =============================================================================

# =============================================================================
# Variables
# =============================================================================
# Values shared by templates and tasks; read them as {{ vars.<name> }}.

[vars]
# Default commit address (~/.gitconfig, ~/.ssh/allowed_signers): used when no machine profile sets
# one. Lives here, not in config.toml: config.toml loads AFTER conf.d and would override the
# machine files (conf.d/machines/), which are the ones allowed to replace it (radiofrance).
git_email = "xunleii@users.noreply.github.com"

# =============================================================================
# Tasks
# =============================================================================
# Small idempotent scripts, run by the bootstrap hooks or with `mise run <name>`.

[tasks.setup-signing-key]
description = "Pick this machine's SSH signing key from the agent (ssh-add -L, fzf) and store it locally"
# Run once per machine, and again to change the key, then `mise dot apply`. Details in the script.
tools = { fzf = "latest" }
run = "sh scripts/setup-signing-key.sh"

# =============================================================================
# Tools
# =============================================================================
# Global mise tools, on PATH everywhere (not only inside this repo).

[tools]
# -----------------------------------------------------------------------------
# Commit tooling
# -----------------------------------------------------------------------------
"npm:czg" = "latest"  # conventional commits CLI

# =============================================================================
# Packages
# =============================================================================
# Homebrew formulas and casks to install.
# Not pruned automatically: `mise bootstrap packages prune` removes what no loaded file declares.

[bootstrap.packages]
# -----------------------------------------------------------------------------
# Signing
# -----------------------------------------------------------------------------
"brew:gnupg" = "latest"  # OpenPGP implementation

# -----------------------------------------------------------------------------
# Git CLI tooling
# -----------------------------------------------------------------------------
"brew:colordiff" = "latest"  # colorized diff output
"brew:difftastic" = "latest"  # syntax-aware structural diff
"brew:gh" = "latest"  # GitHub CLI
"brew:git-absorb" = "latest"  # auto-fixup commits into git history
"brew:git-lfs" = "latest"  # git large file storage
"brew:lazygit" = "latest"  # terminal UI for git
"brew:worktrunk" = "latest"  # Git worktree management

# =============================================================================
# Dotfiles
# =============================================================================
# Files deployed into $HOME. `symlink` points back into this repo (edit here, nothing to
# re-apply), `template` renders a *.tera file, `absent` removes a retired file.

[dotfiles]
"~/.config/lazygit" = { source = "home/.config/lazygit", mode = "symlink-each" }
"~/.gitconfig" = { source = "home/.gitconfig.tera", mode = "template" }
"~/.gitignore" = { source = "home/.gitignore", mode = "symlink" }
"~/.config/fish/functions/__git_remote_slug.fish" = { source = "home/.config/fish/functions/__git_remote_slug.fish", mode = "symlink" }
"~/.config/fish/functions/clone.fish" = { source = "home/.config/fish/functions/clone.fish", mode = "symlink" }
