# Read by mise before any config: platform environments (unix, macos, macos-arm64, ...) are
# active automatically, so each module's mise.macos.toml loads on macOS only.
auto_env = true

# Default machine profile (conf.d/machines/mise.home.toml). `-E <profile>` and the machine-local,
# gitignored miserc.local.toml (written by the dots:persist:profile task) replace this list, they do not add to it.
env = ["home"]
