# --- Machine layout
# macOS-only repo (see the guard in .chezmoi.yaml.tmpl and
# .chezmoiscripts/run_before_00-macos-only.sh.tmpl). Both roots live on
# volumes of their own (external drive or dedicated APFS volume, neither
# guaranteed mounted); `spaces` is the single source of truth for the Space names
# — conf.d/40-environment.fish.tmpl exports it for clone(), so add a Space here
# and nowhere else. Documented in docs/SPACES.md.
runtimes_root: /Volumes/Runtimes
spaces_root: /Volumes/Spaces
spaces:
    - Lab
    - Work
    - OSS
    - Personal

# --- application version
# Only darwin/{amd64,arm64} release assets are listed: this repo does not
# target any other OS.
packages:
    mise:
        # renovate: datasource=github-tags depName=jdx/mise
        version: latest
        release_names:
            darwin/amd64: mise-*-macos-x64
            darwin/arm64: mise-*-macos-arm64

    ocx:
        # renovate: datasource=github-tags depName=kdcokenny/ocx
        version: latest
        release_names:
            darwin/amd64: ocx-darwin-x64
            darwin/arm64: ocx-darwin-arm64

    usage:
        # renovate: datasource=github-tags depName=jdx/usage
        version: latest
        release_names:
            darwin/amd64: usage-universal-apple-darwin.tar.gz
            darwin/arm64: usage-universal-apple-darwin.tar.gz
